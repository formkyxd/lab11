name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, dev, uat, qa]
  pull_request:
    branches: [main, master, develop, dev, uat, qa]

jobs:
  tests:
    name: Tests (coverage ≥ 50%)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: xdebug

      - name: Copy .env.ci
        run: cp .env.ci .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: php artisan test --coverage --min=50
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Copy .env.ci
        run: cp .env.ci .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --error-format=github

  lint:
    name: Linting (Laravel Pint)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (test mode — no auto-fix for long-lived branches)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/qa'
        run: vendor/bin/pint --test

      - name: Run Pint (auto-fix for other branches)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/uat' && github.ref != 'refs/heads/qa'
        run: vendor/bin/pint

  deploy-dev:
    name: Deploy → Development
    runs-on: ubuntu-latest
    needs: [tests, phpstan, lint]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4
      - name: Simulate deploy to DEV
        run: |
          cp .env.dev .env
          echo "Deploying to development with .env.dev"

  deploy-uat:
    name: Deploy → UAT
    runs-on: ubuntu-latest
    needs: [tests, phpstan, lint]
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/qa'

    steps:
      - uses: actions/checkout@v4
      - name: Simulate deploy to UAT
        run: |
          cp .env.uat .env
          echo "Deploying to uat with .env.uat"

  deploy-prod:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [tests, phpstan, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
      - name: Simulate deploy to PROD
        run: |
          cp .env.prod .env
          echo "Deploying to production with .env.prod"
